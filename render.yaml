services:
  - type: web
    name: mx-fatasy-league
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py main:app
    envVars:
      - key: SECRET_KEY
        value: my-super-secret-key-for-mx-fantasy-league-2025
      - key: FLASK_ENV
        value: production
      - key: CRON_SECRET
        generateValue: true

  # Kör påminnelser direkt mot DB — slipper HTTPS/curl mot web (SSL-problem på Render Cron).
  - type: cron
    name: push-reminders
    env: python
    schedule: "* * * * *"
    buildCommand: pip install -r requirements-cron.txt
    startCommand: python scripts/run_reminders_direct.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: DATABASE_URL
        fromService:
          type: web
          name: mx-fatasy-league
          envVarKey: DATABASE_URL
      - key: VAPID_PRIVATE_KEY
        fromService:
          type: web
          name: mx-fatasy-league
          envVarKey: VAPID_PRIVATE_KEY
      - key: VAPID_PUBLIC_KEY
        fromService:
          type: web
          name: mx-fatasy-league
          envVarKey: VAPID_PUBLIC_KEY
      - key: VAPID_SUBJECT
        fromService:
          type: web
          name: mx-fatasy-league
          envVarKey: VAPID_SUBJECT
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: mx-fatasy-league
          envVarKey: RENDER_EXTERNAL_URL
