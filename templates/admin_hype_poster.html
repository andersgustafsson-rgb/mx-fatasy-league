<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hype Poster Studio — Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            background-attachment: fixed;
        }
        .cyberpunk-header { font-family: 'Orbitron', monospace; text-shadow: 0 0 10px rgba(34, 211, 238, 0.8); }
        .section-card {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            border: 2px solid #22d3ee;
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.25);
        }
        .btn-primary {
            background: linear-gradient(135deg, #22d3ee 0%, #06b6d4 100%);
            color: #0f172a;
            font-weight: 600;
        }
        .btn-primary:hover { filter: brightness(1.1); }
        .btn-secondary {
            background: #374151;
            color: #f9fafb;
            border: 1px solid #4b5563;
        }
        .btn-secondary:hover { background: #4b5563; }
        .btn-warm {
            background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
            color: #0f172a;
            font-weight: 700;
        }
        #preview-img {
            width: 100%;
            border-radius: 0.75rem;
            border: 1px solid rgba(34, 211, 238, 0.35);
            background: #0f172a;
            min-height: 12rem;
            object-fit: contain;
        }
    </style>
</head>
<body class="min-h-screen text-gray-100">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <div class="text-center mb-8">
            <h1 class="cyberpunk-header text-3xl md:text-4xl font-bold text-cyan-400 mb-2">HYPE POSTER STUDIO</h1>
            <p class="text-gray-300">Säljande Facebook-poster inför race — nedräkning + “har ni satt picks?”</p>
            <div class="mt-4 flex flex-wrap justify-center gap-3">
                <a href="/admin" class="btn-secondary px-5 py-2 rounded-lg inline-block">← Admin</a>
                <a href="/admin/social-recap" class="btn-secondary px-5 py-2 rounded-lg inline-block">Recap Studio</a>
                <a href="/" class="btn-secondary px-5 py-2 rounded-lg inline-block">Hem</a>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="section-card rounded-lg p-6">
                <h2 class="text-xl font-bold text-cyan-400 mb-4">Inställningar</h2>

                <label class="block text-sm text-gray-300 mb-1">Tävling</label>
                <select id="competition-select" class="w-full mb-4 px-3 py-2 bg-gray-800 border border-gray-600 rounded-lg text-white">
                    <option value="">Laddar…</option>
                </select>

                <label class="block text-sm text-gray-300 mb-1">Format</label>
                <select id="layout-select" class="w-full mb-4 px-3 py-2 bg-gray-800 border border-gray-600 rounded-lg text-white">
                    <option value="facebook" selected>Facebook feed (liggande)</option>
                    <option value="og">Open Graph / länkförhandsvisning</option>
                    <option value="story">Story / Reels still (9:16)</option>
                </select>

                <div id="stats-box" class="mb-4 hidden rounded-lg border border-emerald-700/40 bg-emerald-950/20 p-3 text-sm">
                    <div class="text-emerald-300 font-bold mb-1">Picks-status</div>
                    <div id="stats-text" class="text-gray-300"></div>
                </div>

                <div class="flex flex-wrap gap-3 mb-4">
                    <button type="button" id="btn-refresh" class="btn-primary px-5 py-2.5 rounded-lg">Generera poster</button>
                    <a id="btn-download" class="btn-warm px-5 py-2.5 rounded-lg inline-block opacity-50 pointer-events-none" download="mx-hype.png">Ladda ner PNG</a>
                </div>
                <p id="status-msg" class="text-sm text-gray-400"></p>
            </div>

            <div class="section-card rounded-lg p-6">
                <h2 class="text-xl font-bold text-cyan-400 mb-4">Förhandsvisning</h2>
                <img id="preview-img" alt="Hype poster preview" />
            </div>
        </div>

        <div class="section-card rounded-lg p-6 mt-6">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
                <h2 class="text-xl font-bold text-cyan-400">Facebook-text</h2>
                <button type="button" id="btn-copy" class="btn-secondary px-4 py-2 rounded-lg" disabled>Kopiera text</button>
            </div>
            <textarea id="caption-text" rows="12" class="w-full px-3 py-2 bg-gray-800 border border-gray-600 rounded-lg text-white text-sm" placeholder="Generera en poster för att få text…"></textarea>
            <p class="text-xs text-gray-500 mt-2">Klistra in texten i Facebook-inlägget tillsammans med PNG:en.</p>
        </div>
    </div>

    <script>
        const compSelect = document.getElementById('competition-select');
        const layoutSelect = document.getElementById('layout-select');
        const btnRefresh = document.getElementById('btn-refresh');
        const btnDownload = document.getElementById('btn-download');
        const btnCopy = document.getElementById('btn-copy');
        const previewImg = document.getElementById('preview-img');
        const captionText = document.getElementById('caption-text');
        const statusMsg = document.getElementById('status-msg');
        const statsBox = document.getElementById('stats-box');
        const statsText = document.getElementById('stats-text');
        let blobUrl = null;

        function queryParams() {
            const id = compSelect.value;
            if (!id) return null;
            const p = new URLSearchParams();
            p.set('competition_id', id);
            p.set('layout', layoutSelect.value);
            return p;
        }

        function downloadBase() {
            const opt = compSelect.options[compSelect.selectedIndex];
            let name = (opt && opt.textContent) || 'race';
            name = name.split('·')[0].trim();
            name = name
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-zA-Z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '')
                .toLowerCase()
                .slice(0, 50);
            return 'mx-hype-' + (name || 'race');
        }

        async function loadCompetitions() {
            try {
                const res = await fetch('/get_competitions_for_import');
                const data = await res.json();
                const comps = data.competitions || (Array.isArray(data) ? data : []);
                const today = new Date().toISOString().slice(0, 10);
                comps.sort((a, b) => {
                    const da = a.event_date || '';
                    const db = b.event_date || '';
                    return da.localeCompare(db);
                });
                compSelect.innerHTML = '<option value="">— Välj tävling —</option>';
                let nextUpcoming = null;
                for (const c of comps) {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    const label = `${c.name || 'Race'}${c.series ? ' [' + c.series + ']' : ''}${c.event_date ? ' · ' + c.event_date : ''}`;
                    opt.textContent = label;
                    compSelect.appendChild(opt);
                    if (!nextUpcoming && c.event_date && c.event_date >= today && !c.has_results) {
                        nextUpcoming = String(c.id);
                    }
                }
                if (nextUpcoming) compSelect.value = nextUpcoming;
                else if (comps.length) {
                    // fallback: latest
                    const last = comps[comps.length - 1];
                    compSelect.value = String(last.id);
                }
            } catch (e) {
                compSelect.innerHTML = '<option value="">Kunde inte ladda tävlingar</option>';
                statusMsg.textContent = String(e);
            }
        }

        async function refreshPreview() {
            const p = queryParams();
            if (!p) {
                statusMsg.textContent = 'Välj en tävling.';
                return;
            }
            statusMsg.textContent = 'Genererar…';
            btnCopy.disabled = true;
            btnDownload.classList.add('opacity-50', 'pointer-events-none');
            try {
                const apiUrl = '/admin/api/hype-poster?' + p.toString();
                const res = await fetch(apiUrl);
                const json = await res.json();
                if (!res.ok) throw new Error(json.error || res.statusText);

                captionText.value = json.caption || '';
                btnCopy.disabled = !json.caption;

                const st = json.picks_stats || {};
                statsBox.classList.remove('hidden');
                statsText.textContent =
                    `${st.complete || 0} kompletta lineups` +
                    (st.started ? ` · ${st.started} har börjat tippa` : '') +
                    ` · ${st.total_users || 0} användare totalt`;

                const ts = Date.now();
                const pngUrl = '/admin/api/hype-poster.png?' + p.toString() + '&_=' + ts;
                const imgRes = await fetch(pngUrl);
                if (!imgRes.ok || !(imgRes.headers.get('content-type') || '').includes('image/png')) {
                    const t = await imgRes.text();
                    throw new Error('PNG misslyckades: ' + t.slice(0, 200));
                }
                const blob = await imgRes.blob();
                if (blobUrl) URL.revokeObjectURL(blobUrl);
                blobUrl = URL.createObjectURL(blob);
                previewImg.src = blobUrl;
                btnDownload.href = blobUrl;
                btnDownload.download = downloadBase() + '-' + layoutSelect.value + '.png';
                btnDownload.classList.remove('opacity-50', 'pointer-events-none');
                statusMsg.textContent = 'Klar — ladda ner PNG och kopiera Facebook-texten.';
            } catch (e) {
                statusMsg.textContent = String(e.message || e);
            }
        }

        btnRefresh.addEventListener('click', refreshPreview);
        layoutSelect.addEventListener('change', () => {
            if (compSelect.value) refreshPreview();
        });
        compSelect.addEventListener('change', () => {
            if (compSelect.value) refreshPreview();
        });
        btnCopy.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(captionText.value || '');
                statusMsg.textContent = 'Text kopierad.';
            } catch (_) {
                captionText.select();
                statusMsg.textContent = 'Markera och kopiera manuellt (Ctrl+C).';
            }
        });

        loadCompetitions().then(() => {
            if (compSelect.value) refreshPreview();
        });
    </script>
</body>
</html>
