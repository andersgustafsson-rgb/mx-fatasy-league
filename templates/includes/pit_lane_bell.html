{% if is_logged_in %}
<div class="relative z-[200]" id="pit-lane-bell-wrap">
  <button
    type="button"
    id="pit-lane-bell-btn"
    class="pit-lane-bell-btn relative inline-flex items-center justify-center leading-none cursor-pointer"
    title="Pit Lane — meddelanden"
    aria-label="Meddelanden"
  >
    <svg class="pit-lane-bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    <span
      id="pit-lane-badge"
      class="hidden absolute -top-1 -right-1 min-w-[16px] h-4 px-1 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center pointer-events-none"
    >0</span>
  </button>
  <div
    id="pit-lane-dropdown"
    class="hidden w-72 max-w-[90vw] bg-gray-900 border border-gray-600 rounded-lg shadow-2xl overflow-hidden"
  >
    <div class="px-3 py-2 border-b border-gray-700 flex justify-between items-center">
      <span class="text-sm font-bold text-cyan-400">Pit Lane</span>
      <a href="{{ url_for('pit_lane.pit_lane_page') }}" class="text-xs text-cyan-300 hover:underline">Öppna alla →</a>
    </div>
    <div id="pit-lane-dropdown-list" class="max-h-64 overflow-y-auto">
      <p class="px-3 py-2 text-xs text-gray-500">Laddar…</p>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='push_challenges.js') }}?v=6"></script>
<script src="{{ url_for('static', filename='pit_lane_bell.js') }}?v=8"></script>
{% endif %}
