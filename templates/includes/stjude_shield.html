{# St. Jude crest. Set sj_city, sj_year, sj_uid before include. #}
{% set _uid = sj_uid | default('sj') %}
{% set _city = (sj_city or 'GLENDALE')|upper %}
{% set _year = sj_year or '' %}
<svg class="sj-shield" viewBox="0 0 220 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="sjRed-{{ _uid }}" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="0.45" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="sjRibbon-{{ _uid }}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fecdd3"/>
      <stop offset="0.5" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>
  </defs>
  <path d="M110 14 L198 64 L198 164 L110 226 L22 164 L22 64 Z"
        fill="none" stroke="#7f1d1d" stroke-width="9" opacity="0.45"/>
  <path d="M110 14 L198 64 L198 164 L110 226 L22 164 L22 64 Z"
        fill="#14080c" stroke="url(#sjRed-{{ _uid }})" stroke-width="6" stroke-linejoin="miter"/>
  <path d="M110 30 L180 72 L180 158 L110 208 L40 158 L40 72 Z"
        fill="none" stroke="url(#sjRed-{{ _uid }})" stroke-width="1.8"/>
  <path d="M110 78 C98 68 88 72 88 84 C88 96 98 104 110 118 C122 104 132 96 132 84 C132 72 122 68 110 78 Z"
        fill="#e11d48" stroke="#fecdd3" stroke-width="2"/>
  <path d="M8 112 L212 112 L204 130 L16 130 Z" fill="url(#sjRibbon-{{ _uid }})"/>
  <text x="110" y="124.5" text-anchor="middle" fill="#1a0508"
        font-size="7.5" font-family="Arial, Helvetica, sans-serif" font-weight="800"
        letter-spacing="0.35" textLength="168" lengthAdjust="spacingAndGlyphs">LOVE MOTO · STOP CANCER</text>
  <text x="110" y="160" text-anchor="middle" fill="#fecdd3"
        font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="700"
        letter-spacing="1" textLength="120" lengthAdjust="spacingAndGlyphs">ST. JUDE</text>
  <text x="110" y="182" text-anchor="middle" fill="#fda4af"
        font-size="10" font-family="Arial, Helvetica, sans-serif" font-weight="700"
        letter-spacing="1.1" textLength="108" lengthAdjust="spacingAndGlyphs">{{ _city }} · {{ _year }}</text>
</svg>
