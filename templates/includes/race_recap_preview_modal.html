{# «Din kväll» post-race summary — live API + offline demo preview. #}
<style>
  #raceRecapModal {
    padding: 0.75rem;
    box-sizing: border-box;
  }
  #raceRecapModal .race-recap-sheet {
    box-sizing: border-box;
    width: 100%;
    max-width: min(26rem, 100%);
    border-radius: 1.1rem;
    border: 1px solid rgba(34, 211, 238, 0.35);
    background:
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(6, 182, 212, 0.22), transparent 55%),
      radial-gradient(ellipse 70% 40% at 100% 100%, rgba(251, 146, 60, 0.12), transparent 50%),
      #0b1220;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
    padding: 1.15rem 1.15rem 1.25rem;
    position: relative;
    overflow: hidden;
  }
  #raceRecapModal .race-recap-sheet::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 3px;
    background: linear-gradient(90deg, #06b6d4, #f59e0b, #fb923c);
  }
  #raceRecapModal .race-recap-eyebrow {
    font-size: 0.65rem;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #67e8f9;
    margin: 0 0 0.35rem;
  }
  #raceRecapModal .race-recap-title {
    font-size: 1.35rem;
    font-weight: 800;
    color: #f8fafc;
    line-height: 1.2;
    margin: 0 0 0.25rem;
  }
  #raceRecapModal .race-recap-sub {
    font-size: 0.8rem;
    color: #94a3b8;
    margin: 0 0 1rem;
  }
  #raceRecapModal .race-recap-hero {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.55rem;
    margin-bottom: 0.85rem;
  }
  #raceRecapModal .race-recap-stat {
    border-radius: 0.75rem;
    border: 1px solid #2a3548;
    background: rgba(15, 23, 42, 0.85);
    padding: 0.75rem 0.7rem;
    text-align: center;
  }
  #raceRecapModal .race-recap-stat .lbl {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #64748b;
  }
  #raceRecapModal .race-recap-stat .val {
    font-size: 1.55rem;
    font-weight: 800;
    color: #67e8f9;
    margin-top: 0.15rem;
    line-height: 1.1;
  }
  #raceRecapModal .race-recap-stat .val--gold { color: #fbbf24; }
  #raceRecapModal .race-recap-stat .hint {
    font-size: 0.7rem;
    color: #86efac;
    margin-top: 0.2rem;
    font-weight: 600;
    min-height: 1rem;
  }
  #raceRecapModal .race-recap-stat .hint--down { color: #fca5a5; }
  #raceRecapModal .race-recap-stat .hint--muted { color: #94a3b8; }
  #raceRecapModal .race-recap-highlights {
    list-style: none;
    margin: 0 0 1rem;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  #raceRecapModal .race-recap-highlights li {
    display: flex;
    align-items: flex-start;
    gap: 0.55rem;
    font-size: 0.82rem;
    color: #cbd5e1;
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid #1e293b;
    border-radius: 0.55rem;
    padding: 0.55rem 0.65rem;
    line-height: 1.35;
  }
  #raceRecapModal .race-recap-highlights .dot {
    flex-shrink: 0;
    width: 0.55rem;
    height: 0.55rem;
    margin-top: 0.35rem;
    border-radius: 999px;
    background: #22d3ee;
  }
  #raceRecapModal .race-recap-highlights .dot--gold { background: #fbbf24; }
  #raceRecapModal .race-recap-highlights .dot--orange { background: #fb923c; }
  #raceRecapModal .race-recap-rival {
    border-radius: 0.65rem;
    border: 1px solid rgba(251, 191, 36, 0.35);
    background: rgba(120, 53, 15, 0.22);
    padding: 0.65rem 0.75rem;
    font-size: 0.8rem;
    color: #fde68a;
    margin-bottom: 1rem;
    font-weight: 600;
  }
  #raceRecapModal .race-recap-rival.is-empty { display: none; }
  #raceRecapModal .race-recap-actions {
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
  }
  #raceRecapModal .race-recap-actions .btn-primary {
    width: 100%;
    border-radius: 0.75rem;
    background: linear-gradient(90deg, #22d3ee, #34d399);
    color: #0f172a;
    font-weight: 800;
    font-size: 0.9rem;
    padding: 0.7rem 1rem;
    border: none;
    cursor: pointer;
  }
  #raceRecapModal .race-recap-actions .btn-secondary {
    width: 100%;
    border-radius: 0.75rem;
    background: #1e293b;
    color: #e2e8f0;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 0.65rem 1rem;
    border: 1px solid #334155;
    cursor: pointer;
  }
  #raceRecapModal .race-recap-demo-tag {
    position: absolute;
    top: 0.65rem;
    right: 2.5rem;
    font-size: 0.6rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #fbbf24;
    background: rgba(120, 53, 15, 0.5);
    border: 1px solid rgba(251, 191, 36, 0.4);
    border-radius: 999px;
    padding: 0.15rem 0.45rem;
  }
  #raceRecapModal .race-recap-demo-tag.is-hidden { display: none; }
</style>

<div id="raceRecapModal" class="hidden fixed inset-0 z-[99997] flex items-end sm:items-center justify-center bg-black/75 backdrop-blur-[2px]" onclick="if (event.target === this) closeRaceRecap();" role="presentation">
  <div class="race-recap-sheet" role="dialog" aria-modal="true" aria-labelledby="raceRecapTitle">
    <span id="raceRecapDemoTag" class="race-recap-demo-tag is-hidden">Demo</span>
    <button type="button" onclick="closeRaceRecap();" class="absolute top-2 right-2 text-slate-400 hover:text-white text-2xl leading-none w-8 h-8 flex items-center justify-center" aria-label="Stäng">×</button>

    <p class="race-recap-eyebrow">Din kväll</p>
    <h2 id="raceRecapTitle" class="race-recap-title">—</h2>
    <p id="raceRecapSub" class="race-recap-sub">Resultat inne — så gick det för dig</p>

    <div class="race-recap-hero">
      <div class="race-recap-stat">
        <div class="lbl">Poäng</div>
        <div id="raceRecapPoints" class="val">—</div>
        <div id="raceRecapVsAvg" class="hint hint--muted"></div>
      </div>
      <div class="race-recap-stat">
        <div class="lbl">Placering</div>
        <div id="raceRecapRank" class="val val--gold">—</div>
        <div id="raceRecapDelta" class="hint hint--muted"></div>
      </div>
    </div>

    <ul id="raceRecapHighlights" class="race-recap-highlights"></ul>

    <div id="raceRecapRival" class="race-recap-rival is-empty"></div>

    <div class="race-recap-actions">
      <button type="button" id="raceRecapShareBtn" class="btn-primary">Dela din kväll</button>
      <button type="button" class="btn-secondary" onclick="closeRaceRecap();">Stäng</button>
    </div>
  </div>
</div>

<script>
(function () {
  var DEMO = {
    competition_id: null,
    race_name: 'Canadian GP',
    series: 'WSX',
    points: 186,
    race_rank: 7,
    field_size: 42,
    vs_avg_label: '+24 vs snitt',
    season_delta_label: '↑ 3 platser',
    highlights: [
      { tone: 'gold', text: 'Holeshot prickad i SX1 — +15 p' },
      { tone: 'cyan', text: 'Jett Lawrence P1 rätt i topp 6' },
      { tone: 'orange', text: 'Wildcard nära: 1 plats från bonus' }
    ],
    rival_line: 'Du slog KalleMX med 12 p den här racehelgen.',
    _demo: true
  };

  var current = null;
  var SEEN_KEY = 'mx_race_recap_seen_v3_' + String(window.currentUsername || 'anon').toLowerCase();
  var SESSION_LOCK = 'mx_race_recap_session_lock_v3';
  var RESHOW_TOKEN_KEY = 'mx_race_recap_reshow_token_v3';
  var serverReshowToken = null;

  function seenLocal() {
    try {
      var raw = localStorage.getItem(SEEN_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.map(String) : [];
    } catch (e) {
      return [];
    }
  }

  function markSeenLocal(competitionId) {
    if (!competitionId) return;
    try {
      var ids = seenLocal();
      var id = String(competitionId);
      if (ids.indexOf(id) === -1) {
        ids.push(id);
        localStorage.setItem(SEEN_KEY, JSON.stringify(ids.slice(-40)));
      }
      sessionStorage.setItem(SESSION_LOCK, id);
    } catch (e) {}
  }

  function markSeenServer(competitionId) {
    if (!competitionId) return;
    var body = JSON.stringify({ competition_id: Number(competitionId) });
    try {
      if (navigator.sendBeacon) {
        var blob = new Blob([body], { type: 'application/json' });
        if (navigator.sendBeacon('/api/race_recap/seen', blob)) return;
      }
    } catch (e) {}
    try {
      fetch('/api/race_recap/seen', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        keepalive: true,
        body: body
      }).catch(function () {});
    } catch (e) {}
  }

  function alreadySeen(competitionId) {
    if (!competitionId) return true;
    // Ny reshow-token: rensa lokal lista EN gång, ignorera inte allt för alltid.
    try {
      if (serverReshowToken) {
        var stored = localStorage.getItem(RESHOW_TOKEN_KEY);
        if (stored !== String(serverReshowToken)) {
          localStorage.setItem(SEEN_KEY, JSON.stringify([]));
          localStorage.setItem(RESHOW_TOKEN_KEY, String(serverReshowToken));
        }
      }
    } catch (e) {}
    var id = String(competitionId);
    if (seenLocal().indexOf(id) !== -1) return true;
    try {
      if (sessionStorage.getItem(SESSION_LOCK) === id) return true;
    } catch (e) {}
    return false;
  }

  function markSeen(competitionId) {
    if (!competitionId) return;
    try {
      if (serverReshowToken) {
        localStorage.setItem(RESHOW_TOKEN_KEY, String(serverReshowToken));
      }
    } catch (e) {}
    markSeenLocal(competitionId);
    markSeenServer(competitionId);
  }

  function fillRecap(data) {
    current = data || null;
    var demoTag = document.getElementById('raceRecapDemoTag');
    if (demoTag) demoTag.classList.toggle('is-hidden', !data._demo);

    var title = document.getElementById('raceRecapTitle');
    var sub = document.getElementById('raceRecapSub');
    var pts = document.getElementById('raceRecapPoints');
    var vs = document.getElementById('raceRecapVsAvg');
    var rank = document.getElementById('raceRecapRank');
    var delta = document.getElementById('raceRecapDelta');
    var list = document.getElementById('raceRecapHighlights');
    var rival = document.getElementById('raceRecapRival');

    if (title) title.textContent = data.race_name || 'Race';
    if (sub) {
      var bits = [];
      if (data.series) bits.push(data.series);
      bits.push('resultat inne — så gick det för dig');
      sub.textContent = bits.join(' · ');
    }
    if (pts) pts.textContent = data.points != null ? String(data.points) : '—';
    if (vs) {
      vs.textContent = data.vs_avg_label || '';
      vs.classList.toggle('hint--down', !!(data.vs_avg_label && String(data.vs_avg_label).charAt(0) === '-'));
      vs.classList.toggle('hint--muted', !data.vs_avg_label);
    }
    if (rank) {
      rank.textContent = data.race_rank != null ? ('#' + data.race_rank) : '—';
    }
    if (delta) {
      var dlab = data.season_delta_label || '';
      if (!dlab && data.field_size) dlab = 'av ' + data.field_size;
      delta.textContent = dlab;
      delta.classList.toggle('hint--down', dlab.indexOf('↓') === 0);
      delta.classList.toggle('hint--muted', !dlab || dlab.indexOf('av ') === 0);
    }
    if (list) {
      list.innerHTML = '';
      (data.highlights || []).forEach(function (h) {
        var li = document.createElement('li');
        var dot = document.createElement('span');
        dot.className = 'dot';
        if (h.tone === 'gold') dot.className += ' dot--gold';
        if (h.tone === 'orange') dot.className += ' dot--orange';
        var txt = document.createElement('span');
        txt.textContent = h.text || '';
        li.appendChild(dot);
        li.appendChild(txt);
        list.appendChild(li);
      });
      if (!(data.highlights || []).length) {
        var li0 = document.createElement('li');
        var dot0 = document.createElement('span');
        dot0.className = 'dot';
        var txt0 = document.createElement('span');
        txt0.textContent = 'Bra fight — kolla detaljerna i dina race-resultat.';
        li0.appendChild(dot0);
        li0.appendChild(txt0);
        list.appendChild(li0);
      }
    }
    if (rival) {
      if (data.rival_line) {
        rival.textContent = data.rival_line;
        rival.classList.remove('is-empty');
      } else {
        rival.textContent = '';
        rival.classList.add('is-empty');
      }
    }
  }

  function openModal() {
    var modal = document.getElementById('raceRecapModal');
    if (!modal) return;
    modal.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }

  window.openRaceRecapPreview = function openRaceRecapPreview() {
    fillRecap(DEMO);
    openModal();
  };

  window.openRaceRecap = function openRaceRecap(data) {
    fillRecap(data);
    // Markera direkt vid visning — annars dyker den upp igen vid refresh innan man stängt.
    if (data && data.competition_id && !data._demo) {
      markSeen(data.competition_id);
    }
    openModal();
  };

  window.closeRaceRecap = function closeRaceRecap() {
    var modal = document.getElementById('raceRecapModal');
    if (modal) modal.classList.add('hidden');
    document.body.style.overflow = '';
    if (current && current.competition_id && !current._demo) {
      markSeen(current.competition_id);
    }
  };
  window.closeRaceRecapPreview = window.closeRaceRecap;

  document.getElementById('raceRecapShareBtn')?.addEventListener('click', function () {
    if (!current || !current.competition_id) {
      alert('Inget race att dela just nu.');
      return;
    }
    if (typeof window.openInviteShare !== 'function') {
      alert('Dela-kortet kommer snart — stäng och använd «Bjud in vänner» under tiden.');
      return;
    }
    var opts = {
      raceRecap: true,
      competitionId: current.competition_id,
      raceName: current.race_name,
      points: current.points,
      series: current.series,
    };
    // Stäng Din kväll så bara resultat-delningen syns (inte hype-kortet).
    window.closeRaceRecap();
    window.openInviteShare(opts);
  });

  document.addEventListener('DOMContentLoaded', function () {
    try {
      var params = new URLSearchParams(window.location.search);
      if (params.get('preview_recap') === '1') {
        setTimeout(function () { window.openRaceRecapPreview(); }, 400);
        return;
      }
    } catch (e) {}

    {% if is_logged_in %}
    setTimeout(function () {
      fetch('/api/race_recap', { credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (!data) return;
          if (data.reshow_token) {
            serverReshowToken = String(data.reshow_token);
          }
          if (!data.available || !data.competition_id) return;
          if (alreadySeen(data.competition_id)) return;
          window.openRaceRecap(data);
        })
        .catch(function () {});
    }, 900);
    {% endif %}
  });
})();
</script>
